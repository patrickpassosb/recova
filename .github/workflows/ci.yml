name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-service:
    name: agent-service (install, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mcp-app:
    name: mcp-app (install, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run check
      - run: bun test

  demo-storefront:
    name: demo-storefront (install, format, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-storefront
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # bun.lock is the canonical lockfile (V1 dev flow); package-lock.json was stale and is removed
      - run: bun install --frozen-lockfile
      - run: npm run format:check
      - run: npm run typecheck
      - run: bun test --preload ./src/test/setup.ts

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker build (agent-service)
    runs-on: ubuntu-latest
    needs: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-service
          push: false
          tags: agent-service:ci
